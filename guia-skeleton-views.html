  background:linear-gradient(rgba(247,248,251,.2),rgba(247,248,251,.2)) padding-box,radial-gradient(circle at 50% 50%,rgba(255,255,255,.03) 44%,rgba(8,14,255,.10) 100%) padding-box,linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)) padding-box,linear-gradient(90deg,rgba(210,212,225,.5),rgba(210,212,225,0) 52%,rgba(210,212,225,.5)) border-box;

/* ---------- Simulador ---------- */

@media (max-width:960px){.lab{grid-template-columns:1fr;justify-items:center}.phone{position:relative;top:0}.panel{width:100%;max-width:520px}}

:root{color-scheme:light;
  --bg:#FFFFFF;--surface:#FFFFFF;--panel:#F7F8FB;--text:#1E1E1E;--muted:#3E4983;--line:#D2D4E1;--brand:#121E6C;

  --shadow:0 24px 60px rgba(18,30,108,.14)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}

.ver{margin-left:auto}
.shell{display:grid;grid-template-columns:272px 1fr;min-height:calc(100vh - 64px)}
.side{position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;padding:24px 0 24px 24px}.sidecard{background:var(--panel);border-radius:21px;padding:16px 12px}.shell.nosb{grid-template-columns:1fr}.shell.nosb .side{display:none}
.side h4{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 14px 10px}

main{padding:32px 40px 96px;min-width:0}

.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.info{background:var(--info-bg);color:var(--info)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.neutral{background:var(--chip);color:var(--brand)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}

.pc h3{font-weight:800;font-size:17px;margin:0;line-height:1.25}
.pc p{font-size:14px;line-height:1.6}
.pc .ex{background:var(--panel);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--muted)}
.pc .ex b{color:var(--brand)}
.errflat{height:108px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.breb.onerr{padding:16px;justify-content:center}.breb.onerr .errflat{height:auto;padding:0}
.crit .cmsg{max-width:270px}
.cbtn.ld svg{animation:rot .9s linear infinite}
.cbtn.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.cbtn.ld svg{animation-duration:3s}.cbtn.shake{animation:none}}
.pinbox{position:absolute;z-index:9;border:2px dashed #121E6C;border-radius:14px;pointer-events:none;transition:box-shadow .15s,background .15s}
.pinbox.hl{border-style:solid;background:rgba(18,30,108,.06);box-shadow:0 0 0 4px rgba(18,30,108,.15)}
.legend li{cursor:default}.legend li:focus-visible{outline:3px solid var(--accent)}
.spec span{font-weight:700;color:var(--text)}
.spec p{margin-top:8px;font-size:13px;line-height:1.5;color:var(--muted)}
.ljw{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.ljc{background:var(--surface);border-radius:20px;padding:22px}
.ljc p{font-size:14px;line-height:1.55;margin-top:6px}
.ljp{display:flex;gap:14px;align-items:center;justify-content:center;margin:18px 0 8px}
.ljl{font-size:12px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:8px}
.mp{position:relative;width:130px;height:230px;border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.mp i{position:absolute;left:12px;right:12px;border-radius:8px;display:block;font-style:normal}
.mp .t{top:12px;height:12px;right:auto;width:60px;background:#B9BFDC}
.mp .sk{background:#E3E6F3}.mp .ct{background:#B9C2EA}
.mp .bt{height:28px;border-radius:14px;background:#FFF2F4;border:1.5px solid #FF2947}
.mp .gd{left:0;right:0;height:0;border-radius:0;border-top:2px dashed #121E6C}
.mp .dl{left:auto;right:8px;font:700 10px/14px Montserrat,sans-serif;color:#EE424E;background:#fff;padding:0 5px;border-radius:6px}
.kick{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:8px}
.sec{margin-top:64px;scroll-margin-top:84px}
.sec+.sec{border-top:1px solid var(--line);padding-top:56px}
.sech{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sech h2{font-weight:900;font-size:30px;line-height:1.15;color:var(--brand)}
.ssum{margin:8px 0 4px;font-size:16px;color:var(--muted)}
.areas a{display:inline-flex;align-items:center}
.sn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--chip);color:var(--brand);font-size:12px;font-weight:700;margin-right:8px}
.areas a.on .sn{background:#121E6C;color:#fff}
.foot{margin-top:14px;font-size:12px;color:var(--muted)}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 16px;font-size:14px;font-weight:500}
.item .tag{flex:none;min-width:92px;justify-content:center}
.item small{margin-left:auto;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:10px}
.lnk{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:100px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--brand)}
.note{display:flex;gap:12px;align-items:center;border-radius:16px;background:var(--accent-soft);padding:14px 18px;font-weight:600;font-size:14px;margin-top:20px}
.note b{color:var(--accent)}
.tl{position:relative;height:150px;margin:56px 24px 0}
.tl .bar{position:absolute;left:0;right:0;top:62px;height:14px;border-radius:100px;background:linear-gradient(90deg,#1B8959,#0A53A5 55%,#EE424E)}
.tl .mk{position:absolute;top:0;transform:translateX(-50%);text-align:center;width:130px}
.tl .mk b{display:block;font-weight:800;font-size:20px;color:var(--brand)}
.tl .mk span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tl .mk i{position:absolute;left:50%;top:50px;width:2px;height:38px;background:var(--brand);transform:translateX(-50%)}
.tl .mk.low{top:98px}.tl .mk.low i{top:-34px;height:30px}
.tl .mk.low b{font-size:15px}
.bars{display:grid;gap:14px}
.br{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center}
.br strong{font-weight:700;font-size:14px}
.bb{height:12px;border-radius:100px;margin:4px 0;min-width:4px}
.bb.s{background:var(--line)}.bb.c{background:var(--brand)}
.bv{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.demo{display:flex;gap:28px;flex-wrap:wrap}
.dm{background:var(--surface);border-radius:20px;padding:20px;width:260px}
.dm h3{font-weight:800;font-size:16px;color:var(--brand);margin-bottom:14px}
.dbar{height:16px;border-radius:16px;background:#E3E6F3;margin:10px 0}
.d-pulse{animation:pls 1.4s ease-in-out infinite}
@keyframes pls{50%{opacity:.4}}
.d-sweep{background:linear-gradient(100deg,#E3E6F3 30%,#F7F8FB 50%,#E3E6F3 70%);background-size:300% 100%;animation:swp 1.5s linear infinite}
@keyframes swp{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.d-pulse,.d-sweep{animation:none}}
.bbtn{all:unset;cursor:pointer;display:inline-grid;place-items:center;min-width:140px;height:44px;padding:0 24px;border-radius:100px;background:#FF2947;color:#fff;font-weight:700;font-size:15px}
.bbtn[aria-busy=true]{opacity:.75;cursor:not-allowed}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin:0 3px;animation:dt 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{50%{transform:translateY(-4px);opacity:.5}}
.stub{border:2px dashed var(--line);border-radius:21px;min-height:240px;display:grid;place-items:center;color:var(--muted);font-weight:600;margin-top:20px}
.hero{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.mini{width:118px;height:330px;overflow:hidden;border-radius:16px;box-shadow:var(--shadow);background:#fff;flex:none}
.mini>div{transform:scale(.3);transform-origin:0 0;width:393px}
.step{display:grid;gap:10px;justify-items:center;font-weight:700;font-size:13px;color:var(--brand)}
.arrow{align-self:center;font-weight:800;color:var(--muted);font-size:22px}
@media (max-width:1000px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:24px 18px 72px}.br{grid-template-columns:1fr}}

/* Tipografía sobria: pesos como en las pantallas (Medium 500 y SemiBold 600) */
.brand{font-weight:600}
.banner h1{font-weight:500}
.kick{font-weight:600}
.sech h2,.pnl h2{font-weight:500}
.card h3,.pc h3,.svc h3,.dm h3,.oblk h3,.legend h3,.ljc h3{font-weight:500}
.side h4{font-weight:600}
.side a.on{font-weight:600}
.ptabs button[aria-selected=true]{font-weight:600}
.spec b{font-weight:500}
.spec span{font-weight:600}
.tag{font-weight:600}
.cta,.lnk{font-weight:600}
.sn,.pn{font-weight:600}
.tl .mk b{font-weight:500}
.legend li{font-weight:500}
.sh2{font-weight:600}
.bbtn{font-weight:600}

.scr .body{position:relative;z-index:1}
.scr .stat,.scr .hh{z-index:2}

.tab.on .ti{display:flex;align-items:center;justify-content:center;width:100%;height:36px;padding:0;border-radius:0;background:none;box-shadow:none}
.rfs{position:absolute;left:50%;top:175px;margin-left:-22px;width:44px;height:44px;opacity:0;z-index:6;pointer-events:none;transform:translateY(-219px);will-change:transform,opacity}
.rfs svg{display:block;will-change:transform}
.dm.wide{width:auto;flex:1 1 320px;max-width:460px}
.dbar{background:#F3F4FB}
.d-sweep{background:linear-gradient(100deg,#F3F4FB 30%,#FBFBFE 50%,#F3F4FB 70%);background-size:300% 100%;animation:swp 1.5s linear infinite}
@keyframes pls{50%{opacity:.55}}
.anr{margin:18px 0 4px;border-top:1px solid var(--line)}
.ar{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
.ar>span{font-weight:600;color:var(--brand)}
.ar code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px;margin-right:8px;box-shadow:inset 0 0 0 1px var(--line)}
.tw{overflow-x:auto;border-radius:16px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;line-height:1.45;min-width:1120px}
.tbl th{text-align:left;font-weight:600;color:var(--brand);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .tg td{background:var(--panel);font-weight:600;color:var(--brand)}
.tbl .te{color:var(--muted);font-style:italic}
.ckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
.ckg{background:var(--surface);border-radius:20px;padding:20px 22px 8px}
.gh2{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.ckg h3{font-weight:500;font-size:17px;color:var(--brand);margin:0}
.ck{display:flex;gap:14px;align-items:flex-start;padding:14px 0;margin:0;border-top:1px solid var(--line);cursor:pointer}
.gh2+.ck{border-top:0}
.ck input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.ck input:checked{background:#121E6C;border-color:#121E6C}
.ck input:checked::after{content:'✓';color:#fff;font-size:13px;line-height:1;font-weight:700}
.ck input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ck b{display:block;font-weight:500;font-size:15px;line-height:1.35}
.ck small{display:block;margin-top:3px;font-size:13px;line-height:1.5;color:var(--muted)}
.ck input:checked ~ div{opacity:.55}
.pbar{height:8px;border-radius:100px;background:var(--line);overflow:hidden;margin:0 0 20px}
.pfill{display:block;height:100%;width:0;background:var(--ok);border-radius:100px;transition:width .25s ease}
.osteps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.osteps li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.55}
.osteps li .pn{margin-top:1px}
.osteps b{font-weight:600;color:var(--brand)}
.gantt{position:relative;margin:18px 0 6px}
.gpw{position:absolute;left:160px;right:0;top:0;bottom:22px;pointer-events:none}
.gp{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--accent);display:block}
.gsg{font-weight:600;font-size:12px;color:var(--brand);margin:12px 0 4px}
.gr{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:6px 0;font-size:13px;font-weight:500}
.gr .tr{position:relative;height:14px;background:var(--panel);border-radius:100px}
.gb{position:absolute;top:0;height:14px;border-radius:100px;display:block;background:var(--line);transition:background .2s}
.gb.run{background:repeating-linear-gradient(45deg,#FF2947 0 6px,#FF7A8E 6px 12px);background-size:17px 17px;animation:stp 1s linear infinite}
.gb.done{background:#121E6C}
@keyframes stp{to{background-position:17px 0}}
.gh{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:6px 0 0 160px}
.sdot2{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.sdot2.run{background:var(--accent)}.sdot2.done{background:var(--ok)}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.stages .svc h3{font-size:15px}
@media (prefers-reduced-motion:reduce){.gb.run{animation:none}}
.use .phone{flex:none}
.ctl{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);display:grid;gap:18px}
.ctl h4{margin:0 0 8px;font-weight:600;font-size:13px;color:var(--brand)}
.dtl summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--brand);margin-bottom:10px}
.dtl .insp{margin-bottom:12px}
.legend li{cursor:pointer}
/* Sin saltos de layout: mismo alto en skeleton, contenido y error */
.mod[data-m=dash]>.dash{height:154px}
.dtext.skt{gap:2px}
.lsk{display:flex;flex-direction:column;align-items:center;gap:4px}
.hlist{height:220px}
.plist{height:256px}
.prow.skr{height:52px;padding:4px 0;gap:16px}
.mod[data-m=mov] .errflat{height:220px}
.mod[data-m=prod] .errflat{height:256px}
.mpa .m{top:34px;height:40px;background:#E3E6F3}
.mpa .bt{top:88px}
.mpa.yes .m{animation:ym 5s ease-in-out infinite}
.mpa.yes .bt{animation:yb 5s ease-in-out infinite}
.mpa.no .m{animation:nm 5s ease-in-out infinite}
.mpa.no .bt{animation:nb 5s ease-in-out infinite}
@keyframes ym{0%,25%{height:40px;background:#E3E6F3}45%,85%{height:64px;background:#B9C2EA}100%{height:40px;background:#E3E6F3}}
@keyframes yb{0%,25%{top:88px}45%,85%{top:112px}100%{top:88px}}
@keyframes nm{0%,25%{height:40px;opacity:1}45%,85%{height:0;opacity:0}100%{height:40px;opacity:1}}
@keyframes nb{0%,25%{top:88px}45%,85%{top:48px}100%{top:88px}}
.mpa .lb{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:600 11px Montserrat,sans-serif;color:var(--muted);opacity:0}
.mpa .lb.a{animation:lba 5s infinite}
.mpa .lb.b{animation:lbb 5s infinite}
@keyframes lba{0%,30%{opacity:1}38%,94%{opacity:0}100%{opacity:1}}
@keyframes lbb{0%,38%{opacity:0}45%,85%{opacity:1}92%,100%{opacity:0}}
.mod[data-m=carr]{overflow:hidden;transition:max-height .35s ease,margin-bottom .35s ease,opacity .3s ease}
.mod[data-m=carr][data-state=skeleton]{display:block;max-height:0;margin-bottom:-40px;opacity:0}
.mod[data-m=carr][data-state=loaded]{max-height:80px;margin-bottom:0;opacity:1}
@media (prefers-reduced-motion:reduce){
.mod[data-m=carr]{transition:none}
.mpa.yes .m,.mpa.yes .bt,.mpa.no .m,.mpa.no .bt,.mpa .lb{animation:none}
.mpa.yes .m{height:64px;background:#B9C2EA}.mpa.yes .bt{top:112px}
.mpa.no .m{height:0}.mpa.no .bt{top:48px}.mpa .lb.b{opacity:1}}
.ljl,.step{font-weight:600}
.fa,.arrow{font-weight:500}
</style>

/* ---------- Bloques de pantalla ---------- */
const sk=(w,h,r)=>`<i class="sk" style="width:${w}px;height:${h}px;border-radius:${r}px"></i>`;
const skw=(w,h,r)=>`<i class="skw" style="width:${w}px;height:${h}px;border-radius:${r}px"></i>`;
const head=(t,more)=>`<div class="sh"><h3>${t}</h3>${more?'<button class="more" type="button">Ver más</button>':''}</div>`;
const HIST=[['arrowDown','Maria José Suárez','$100.000','Transferencia recibida',0],['arrowUp','Eduardo Mejía','-$100.000','Transferencia enviada',1],['arrowDown','Maria José Suárez','$100.000','Transferencia recibida',0]];
const PROD=[['savings','Bolsillos','Tu dinero crece al 9.5% E.A.','Abrir'],['yield','CDT','Rentabilidad hasta 12,0% E.A.','Abrir'],['filter','Elimina tus topes','Cambia a depósito ordinario','Cambiar'],['debit','Tarjeta de crédito','Tienes un cupo preaprobado','Activar']];
const ERR={mov:{n:'movimientos',h:220},prod:{n:'más opciones',h:256},breb:{n:'Bre-B',h:140}};
const histRows=()=>HIST.map(([i,n,v,t,neg])=>`<div class="hc">${ic(i)}<div class="hi"><div class="hr2"><b>${n}</b><b class="${neg?'neg':''}">${v}</b></div><span class="lbl">${t}</span></div></div>`).join('');
const prodRows=()=>PROD.map(([i,t,d,c])=>`<div class="prow">${ic(i)}<div class="ptx"><b>${t}</b><span class="lbl">${d}</span></div><button class="abtn" type="button" tabindex="-1">${c}</button></div>`).join('');
const errCard=m=>`<div class="errflat" role="group" aria-label="Error al cargar ${ERR[m].n}"><button class="cbtn" type="button" data-retry="${m}" aria-label="Reintentar cargar ${ERR[m].n}">${ic('update')}</button><p class="cmsg">Hubo un error al cargar esta sección</p></div>`;

function modInner(m,s){
  if(m==='dash') return s==='skeleton'
    ? `<div class="dash"><div class="search">${sk(127,44,100)}<div class="addbtn"></div></div><div class="dtext skt"><div style="height:20px;display:flex;align-items:center">${sk(145,16,16)}</div><div class="bal2">${sk(321,52,40)}${ic('view')}</div></div></div>`
    : `<div class="dash"><div class="search"><div class="pill"><span>****0099</span>${ic('chevDown')}</div><div class="addbtn">${ic('menu')}</div></div><div class="dtext"><span class="lbl">Depósito Ordinario</span><div class="bal"><b>$500.400.000</b>${ic('view')}</div></div></div>`;
  if(m==='carr') return s==='skeleton' ? '' : `<div class="carr"><div class="cic">${ic('safe')}<b class="dot"></b></div><div class="cinfo"><span class="t16">Ya validamos tu información</span><span class="lbl">Ahora puedes crear tu CDT</span></div></div>`;
  if(m==='acts'){
    if(s==='skeleton') return `<div class="acts l">${[0,1,2,3].map(()=>`<div class="act">${sk(84.4,68,16)}<div class="lsk">${sk(70,14,14)}${sk(46,14,14)}</div></div>`).join('')}</div>`;
    const A=[['send','Transferir'],['scan','Escanear<br>QR'],['withdrawal','Retirar'],['charge','Depositar'],[null,'Pagar<br>facturas']];
    return `<div class="acts l">${A.map(([i,l])=>`<div class="act"><div class="box">${i?ic(i):''}</div><span>${l}</span></div>`).join('')}</div>`;
  }
  if(m==='breb'&&s==='error') return `<div class="breb onerr">${errCard('breb')}</div>`;
  if(m==='breb') return s==='skeleton'
    ? `<div class="breb"><div class="bh">${skw(64,24,12)}${skw(150,20,10)}</div><div class="brow">${[0,1,2].map(()=>`<div class="bt">${skw(107,44,16)}${skw(64,16,8)}</div>`).join('')}</div></div>`
    : `<div class="breb"><div class="bh">${ic('breb')}<div class="bid"><span>Llave: @3121234323</span>${ic('chevRight')}</div></div><div class="brow">${[['qr','Escanear/ Leer'],['copy','Copiar'],['send','Transferir']].map(([i,l])=>`<div class="bt"><div class="box">${ic(i)}</div><span>${l}</span></div>`).join('')}</div></div>`;
  if(m==='mov'){
    if(s==='error') return head('Movimientos',false)+errCard('mov');
    if(s==='skeleton') return head('Movimientos',true)+`<div class="hlist">${[0,1,2].map(()=>`<div class="hc">${sk(24,24,8)}<div class="hi"><div class="hr">${sk(225,20,16)}${sk(88,20,16)}</div>${sk(187,20,16)}</div></div>`).join('')}</div>`;
    return head('Movimientos',true)+`<div class="hlist">${HIST.map(([i,n,v,t,neg])=>`<div class="hc">${ic(i)}<div class="hi"><div class="hr2"><b>${n}</b><b class="${neg?'neg':''}">${v}</b></div><span class="lbl">${t}</span></div></div>`).join('')}</div>`;
  }
  if(m==='prod'){
    if(s==='error') return head('Más opciones para ti',false)+errCard('prod');
    if(s==='skeleton') return head('Más opciones para ti',true)+`<div class="plist">${[0,1,2,3].map(()=>`<div class="prow skr">${sk(24,24,8)}<div class="ptx" style="flex:1;min-width:0">${sk(85,20,16)}${sk(187,20,16)}</div><span style="margin-left:auto">${sk(88,36,35)}</span></div>`).join('')}</div>`;
    return head('Más opciones para ti',true)+`<div class="plist">${PROD.map(([i,t,d,c])=>`<div class="prow">${ic(i)}<div class="ptx"><b>${t}</b><span class="lbl">${d}</span></div><button class="abtn" type="button">${c}</button></div>`).join('')}</div>`;
  }
  return '';
}

      <div class="mk" style="left:3%"><b>0,1 s</b><span>Instantáneo</span><i></i></div>
      <div class="mk" style="left:28%"><b>1 s</b><span>Se nota la espera</span><i></i></div>
      <div class="mk" style="left:52%"><b>3 s</b><span>Umbral provisional</span><i></i></div>
      <div class="mk" style="left:92%"><b>10 s</b><span>Límite de atención</span><i></i></div></div>
      <div class="note"><b>!</b> Medir los tiempos de respuesta y de carga, y ajustar estos valores con datos reales.</div></div>
      <div class="pnl"><h2>Cuatro tiempos por definir</h2><div class="grid">${C.map(([t,s,st])=>`<div class="card"><h3>${t}</h3><p>${s}</p><div class="cf">${tag(st)}</div></div>`).join('')}</div></div>`;}
  if(p.k==='lay'){
    const mph=(h,st,g,sh)=>{const bt=34+h+14;return `<div class="mp"><i class="t"></i><i class="${st}" style="top:34px;height:${h}px"></i><i class="bt" style="top:${bt}px"></i>${g!=null?`<i class="gd" style="top:${g}px"></i>`:''}${sh?`<i class="dl" style="top:${g+4}px">+${sh} px</i>`:''}</div>`;};
    const ac=k=>`<div class="ljc"><span class="tag ${k==='yes'?'ok':'neutral'}">${k==='yes'?'El módulo aplica':'El módulo no aplica'}</span><div class="ljp"><div class="mp mpa ${k}"><i class="t"></i><i class="m"></i><i class="bt"></i><span class="lb a">Cargando</span><span class="lb b">${k==='yes'?'Cargado':'No aplica'}</span></div></div><p>${k==='yes'?'El skeleton crece hasta el tamaño del contenido y empuja suavemente lo que está debajo.':'El skeleton se contrae y lo que está debajo sube suavemente a su lugar.'}</p></div>`;
    const pair=(a,b)=>`<div class="ljp"><div><div class="ljl">Cargando</div>${a}</div><span class="arrow">→</span><div><div class="ljl">Cargado</div>${b}</div></div>`;
    return phead(p)+`<div class="pnl"><h2>El layout no se mueve al cargar</h2><div class="ljw">
      <div class="ljc"><span class="tag ok">Así debe verse</span>${pair(mph(64,'sk',112),mph(64,'ct',112))}<p>El skeleton mide lo mismo que el contenido. El botón queda en el mismo lugar antes y después de cargar.</p></div>
      <div class="ljc"><span class="tag bad">Así NO debe verse</span>${pair(mph(40,'sk'),mph(64,'ct',88,24))}<p>El contenido es más alto que el skeleton y empuja hacia abajo todo lo que sigue, incluso lo que la persona iba a tocar.</p></div></div><div class="note"><b>✓</b> Los prototipos de esta guía aplican la regla: en cada módulo, el skeleton, el contenido y el error miden lo mismo.</div></div>
    <div class="pnl"><h2>Módulos que solo algunos ven</h2><div class="sech" style="margin:-4px 0 12px">${tag('A')}</div><p class="ssum" style="margin-top:0">Son los que no todas las personas tienen, como el aviso del carrusel o una tarjeta de crédito. Su skeleton se transforma al tamaño real del contenido, y si el módulo no aplica, se contrae.</p><div class="ljw" style="margin-top:18px">${ac('yes')}${ac('no')}</div><div class="chips"><span class="tag neutral">Solo durante la carga</span><span class="tag neutral">~300 ms*</span><span class="tag neutral">Desplaza suavemente lo de abajo</span><span class="tag neutral">Sin cambios una vez cargado</span></div><div class="foot">* Valor del prototipo, por validar.</div></div>`;}
  if(p.k==='anim'){
    const sw=c=>`<i class="sw" style="background:${c}"></i>`;
    const V=[
     ['Barrido','d-sweep',[['Duración del ciclo','1,5 s'],['Dirección','De izquierda a derecha, en horizontal'],['Colores',`${sw('#F3F4FB')}Gris base <code>#F3F4FB</code><br>${sw('#FBFBFE')}Gris de brillo <code>#FBFBFE</code>`],['Easing','Lineal (linear), sin pausa entre ciclos']]],
     ['Pulso','d-pulse',[['Duración del ciclo','1,4 s'],['Dirección','No aplica: la opacidad baja y sube (100 % → 55 % → 100 %)'],['Colores',`${sw('#F3F4FB')}Gris base <code>#F3F4FB</code><br>Sin gris de brillo: cambia la opacidad`],['Easing','Suave al inicio y al final (ease-in-out)']]]];
    return phead(p)+`<div class="pnl"><h2>Dos versiones existentes</h2><div class="demo">${V.map(([t,c,rows])=>`<div class="dm wide"><h3>${t}</h3><div class="dbar ${c}" style="width:60%"></div><div class="dbar ${c}"></div><div class="dbar ${c}" style="width:80%"></div><div class="anr">${rows.map(([k,v])=>`<div class="ar"><span>${k}</span><div>${v}</div></div>`).join('')}</div><div class="cf">${tag('D')}</div></div>`).join('')}</div><div class="chips"><span class="tag neutral">Con «Reducir movimiento»: gris base estático</span></div><div class="foot">Valores del prototipo, por validar. La animación que se elija aplica a toda la app.</div></div>`;}
  if(p.k==='btn') return phead(p)+`<div class="pnl"><h2>Botón con loader</h2><div class="demo"><div class="dm"><h3>Toca el botón</h3><button class="bbtn bdemo" type="button">Pagar</button><div class="chips"><span class="tag neutral">Se bloquea al cargar</span></div></div><div class="dm"><h3>Scroll infinito</h3><div class="dbar"></div><div class="dbar"></div><div class="dbar" style="width:70%"></div><div style="text-align:center" class="dots"><i style="background:#6C759F"></i><i style="background:#6C759F"></i><i style="background:#6C759F"></i></div><div class="chips"><span class="tag neutral">Loader pequeño al final</span></div></div></div></div>`;
  if(p.k==='play') return phead(p)+`<div class="pnl"><div class="use"><div class="pv ppv" style="height:852px"></div><div class="legend"><h3>Qué falla</h3><div class="seg pcases">${CASES.map(c=>`<button type="button" data-k="${c[0]}" aria-pressed="false">${c[1]}</button>`).join('')}</div><div class="chips pmeta" style="margin:0 0 18px"></div><label class="opt"><input type="checkbox" class="pfail"><span>El reintento también falla</span></label><div class="chips"><button class="lnk preset" type="button">Reiniciar</button></div><div class="note"><b>!</b> Toca «Reintentar» dentro del teléfono.</div></div></div></div>`;
  if(p.k==='order') return phead(p)+`<div class="ptabs" role="tablist">${FLOWS.map((f,i)=>`<button role="tab" aria-selected="${i===0}" data-tab="${i}">${f[0]}</button>`).join('')}</div><div class="pnl tabBody"></div><div class="foot">Fuente: reunión del 20 de octubre con desarrollo. Los datos marcados como propuestos o por definir deben validarse.</div>`;
  if(p.k==='dec') return phead(p)+`<div class="pnl"><div class="list">${DEC.map(([s,t,o])=>`<div class="item">${tag(s)}<span>${t}</span><small>${o}</small></div>`).join('')}</div></div>`;
  if(p.k==='refs') return phead(p)+`<div class="pnl"><div class="grid">${REFS.map(([t,u,s])=>`<a class="card" href="${u}" target="_blank" rel="noopener"><h3>${t}</h3><p>${s}</p></a>`).join('')}</div></div>`;
  if(p.k==='sim') return phead(p)+`<div class="pnl simSlot"></div>`;
  return phead(p);
}
function tabHTML(p,i){
  if(i===0) return `<div class="use"><div class="pv mainpv"${p.ph.html?' style="height:852px"':''}>${p.ph.html?p.ph.html():screenHTML(p.ph.states,{pb:p.ph.pb})}</div><div class="legend"><h3>Anatomía</h3><p class="foot" style="margin:-6px 0 12px">Toca un elemento para verlo en el prototipo.</p><ol>${p.pins.map(([,n,l])=>`<li data-n="${n}" tabindex="0"><span class="pn">${n}</span>${l}</li>`).join('')}</ol>${p.play?'<div class="chips"><button class="lnk bPlay" type="button">Ver la carga normal</button><span class="tag neutral playlab">Listo</span></div>':''}${p.ph.html?'<div class="chips"><button class="lnk critReset" type="button">Reiniciar demo</button></div><div class="note"><b>!</b> Toca el ícono para reintentar.</div>':''}</div></div>`;
  if(i===1) return `<div class="specs">${p.specs.map(([v,l,d])=>`<div class="spec"><b>${v}</b><span>${l}</span><p>${d}</p></div>`).join('')}</div><div class="foot">* Valor del prototipo o provisional, por validar con datos reales.</div>`;
  return `<h2>Decisiones</h2><div class="list" style="margin-bottom:24px">${p.dec.map(([s,t])=>`<div class="item">${tag(s)}<span>${t}</span></div>`).join('')}</div><h2>Recursos</h2><div class="links"><a class="lnk" href="${FIG+p.fig}" target="_blank" rel="noopener">Frame en Figma ↗</a><a class="lnk" href="#/fallar/casos">Prototipo interactivo</a>${p.rel.map(r=>{const q=PG.find(x=>x.id===r);return `<a class="lnk" href="${pageLink(q)}">${q.t}</a>`}).join('')}</div>`;
}
function addPins(sec,p){
  const scr=sec.querySelector('.mainpv .scr'); if(!scr) return;
  const sb=scr.getBoundingClientRect();
  p.pins.forEach(([sel,n])=>scr.querySelectorAll(sel).forEach(el=>{const r=el.getBoundingClientRect(); const d=document.createElement('span'); d.className='pinbox'; d.dataset.n=n;
    Object.assign(d.style,{top:(r.top-sb.top-4)+'px',left:(r.left-sb.left-4)+'px',width:(r.width+8)+'px',height:(r.height+8)+'px'}); scr.appendChild(d);}));
  const pv=sec.querySelector('.mainpv');
  sec.querySelectorAll('.legend li[data-n]').forEach(li=>{
    const set=on=>scr.querySelectorAll(`.pinbox[data-n="${li.dataset.n}"]`).forEach(x=>x.classList.toggle('hl',on));
    const go=()=>{
      const pin=p.pins.find(x=>String(x[1])===li.dataset.n), el=pin&&scr.querySelector(pin[0]); if(!el||!pv) return;
      const top=el.getBoundingClientRect().top-scr.getBoundingClientRect().top;
      const to=Math.max(0,top-(pv.clientHeight-el.offsetHeight)/2);
      const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(pv.scrollTo) pv.scrollTo({top:to,behavior:calm?'auto':'smooth'}); else pv.scrollTop=to;
      set(true); clearTimeout(li._h); li._h=setTimeout(()=>set(false),1500);
    };
    li.onmouseenter=li.onfocus=()=>set(true); li.onmouseleave=li.onblur=()=>set(false);
    li.onclick=go; li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
  });
}
function autoWhenVisible(sec,fn){
  const t=sec.querySelector('.mainpv')||sec;
  if('IntersectionObserver' in window){const o=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){o.disconnect();fn();}},{threshold:.35});o.observe(t);}else fn();
}
function playLoad(sec,p){
  const scr=sec.querySelector('.mainpv .scr'); if(!scr) return;
  (scr._t||[]).forEach(clearTimeout); scr._t=[];
  scr.querySelectorAll('.pinbox').forEach(x=>x.remove());
  const L={dash:600,carr:500,acts:800,breb:1000,mov:1500,prod:2000};
  const set=(m,st)=>{const el=scr.querySelector(`[data-m="${m}"]`);if(!el)return;el.dataset.state=st;el.innerHTML=modInner(m,st);el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap');};
  const lab=sec.querySelector('.playlab'); if(lab) lab.textContent='Cargando…';
  const pv=sec.querySelector('.mainpv'); if(pv&&pv.scrollTo) pv.scrollTo({top:0,behavior:'auto'});
  Object.keys(L).forEach(m=>set(m,'skeleton'));
  Object.entries(L).forEach(([m,ms])=>scr._t.push(setTimeout(()=>set(m,'loaded'),ms)));
  scr._t.push(setTimeout(()=>{if(lab)lab.textContent='Listo';if(sec.isConnected)addPins(sec,p);},2300));
}
const SVC=[
 {id:'free',stage:0,label:'Más opciones para ti',s:0,e:300,mods:['prod'],feeds:['Más opciones para ti'],fail:'No aplica: no depende de un servicio',use:'Desde el primer momento',st:'P'},
 {id:'list',stage:1,label:'Lista de depósitos',s:0,e:900,mods:[],feeds:['Depósito por defecto'],fail:'Error crítico a pantalla completa con reintento',use:'Nada todavía: sin el ID no hay datos del depósito',st:'A'},
 {id:'info',stage:2,label:'Información del depósito',s:900,e:1700,mods:['dash','acts','carr'],feeds:['Saldo','Accesos rápidos'],fail:'Error crítico a pantalla completa con reintento',use:'Los accesos rápidos, apenas llegan',st:'P'},
 {id:'breb',stage:2,label:'Bre-B',s:900,e:2100,mods:['breb'],feeds:['Bre-B'],fail:'Por definir (diseño por recibir)',use:'Sus accesos, cuando carga',st:'D'},
 {id:'mov',stage:2,label:'Movimientos',s:900,e:2600,mods:['mov'],feeds:['Movimientos'],fail:'Error en el módulo con «Reintentar»',use:'No bloquea las transferencias',st:'P'}];
function mountProg(sec){
  const q=x=>sec.querySelector(x); let timers=[],raf=0;
  const speed=()=>parseFloat(sec.querySelector('input[name=pspeed]:checked').value);
  const sched=()=>{const saved=q('.psaved').checked;return SVC.map(x=>{let a=x.s,b=x.e;if(saved&&x.stage>0){if(x.id==='list'){a=0;b=0;}else{a=Math.max(0,a-900);b=Math.max(0,b-900);}}return {...x,s:a,e:b,skip:saved&&x.id==='list'};});};
  const GR=[[1,'Etapa 1'],[2,'Etapa 2 · en paralelo'],[0,'Sin servicio']];
  function draw(sc,D){
    q('.gantt').innerHTML=`<div class="gpw"><i class="gp"></i></div>`+GR.map(([n,t])=>`<div class="gsg">${t}</div>`+sc.filter(x=>x.stage===n).map(x=>`<div class="gr"><span>${x.label}${x.skip?' (omitida)':''}</span><div class="tr"><i class="gb pend" data-sv="${x.id}" style="left:${x.s/D*100}%;width:${Math.max(0,(x.e-x.s))/D*100}%"></i></div></div>`).join('')).join('')+`<div class="gh"><span>0 s</span><span>tiempo (ilustrativo)</span></div>`;
    q('.stages').innerHTML=sc.map(x=>`<div class="svc"><div class="ph" style="display:flex;gap:8px;align-items:center"><i class="sdot2 pend" data-sv="${x.id}"></i><h3>${x.label}</h3></div><div class="chips" style="margin-top:8px">${x.feeds.map(f=>`<span class="tag neutral">${f}</span>`).join('')}</div><p class="fl"><b>Si falla:</b> ${x.fail}</p><p class="fl"><b>Se puede usar:</b> ${x.use}</p><div class="cf">${tag(x.st)}</div></div>`).join('');
  }
  const mark=(id,st)=>sec.querySelectorAll(`[data-sv="${id}"]`).forEach(el=>{el.classList.remove('pend','run','done');el.classList.add(st);});
  function play(){
    timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);
    const sc=sched(),f=speed(),D=Math.max(1,...sc.map(x=>x.e));
    draw(sc,D);
    const host=q('.simHost');host.innerHTML=screenHTML(allS('skeleton'),{nav:false,pb:150});q('.simNav').innerHTML=navHTML();
    const lab=q('.playlab');lab.textContent='Cargando…';
    const set=(m,st)=>{const el=host.querySelector(`[data-m="${m}"]`);if(!el)return;el.dataset.state=st;el.innerHTML=modInner(m,st);el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap');};
    sc.forEach(x=>{
      timers.push(setTimeout(()=>mark(x.id,'run'),x.s*f));
      timers.push(setTimeout(()=>{mark(x.id,'done');x.mods.forEach(m=>set(m,'loaded'));},x.e*f));
    });
    timers.push(setTimeout(()=>{lab.textContent='Listo';},D*f+100));
    const t0=performance.now();
    const step=()=>{if(!sec.isConnected)return;const pr=Math.min(1,(performance.now()-t0)/(D*f));const g=q('.gp');if(g)g.style.left=(pr*100)+'%';if(pr<1)raf=requestAnimationFrame(step);};
    raf=requestAnimationFrame(step);
  }
  q('.bPlay').onclick=play; q('.psaved').onchange=play;
  sec.querySelectorAll('input[name=pspeed]').forEach(r=>r.onchange=play);
  play();
}
function showTab(sec,p,i){
  sec.querySelectorAll('.ptabs button').forEach(b=>b.setAttribute('aria-selected',String(+b.dataset.tab===i)));
  sec.querySelector('.tabBody').innerHTML=tabHTML(p,i); if(i===0) addPins(sec,p);
  if(i===0&&p.play){sec.querySelector('.bPlay').onclick=()=>playLoad(sec,p);if(!sec._auto){sec._auto=1;autoWhenVisible(sec,()=>playLoad(sec,p));}}
  if(i===0&&p.ph.html){const pv=sec.querySelector('.mainpv');pv.onclick=e=>{if(e.target.closest('[data-crit]'))critRun(pv,()=>false)};sec.querySelector('.critReset').onclick=()=>{(pv._t||[]).forEach(clearTimeout);pv._t=[];pv.innerHTML=p.ph.html();addPins(sec,p);};}
}
const holder=document.getElementById('holder');
function mountSec(sec,p){
  if(p.k==='phone'){showTab(sec,p,0);sec.querySelectorAll('.ptabs button').forEach(b=>b.onclick=()=>showTab(sec,p,+b.dataset.tab));}
  if(p.k==='sim') sec.querySelector('.simSlot').appendChild(holder.querySelector('.lab'));
  if(p.k==='cases') mountCases(sec);
  if(p.k==='chk'){const bx=[...sec.querySelectorAll('.ck input')],u=()=>{const n=bx.filter(b=>b.checked).length;sec.querySelector('.ckcount').textContent=`${n} de ${bx.length} completados`;sec.querySelector('.pfill').style.width=(n/bx.length*100)+'%';};bx.forEach(b=>b.onchange=u);u();}
  if(p.k==='prog') mountProg(sec);
  if(p.k==='order'){const so=i=>{sec.querySelectorAll('.ptabs button').forEach(b=>b.setAttribute('aria-selected',String(+b.dataset.tab===i)));sec.querySelector('.tabBody').innerHTML=flowHTML(FLOWS[i][1])};so(0);sec.querySelectorAll('.ptabs button').forEach(b=>b.onclick=()=>so(+b.dataset.tab));}
  if(p.k==='btn'){const b=sec.querySelector('.bdemo');b.onclick=()=>{if(b.getAttribute('aria-busy')==='true')return;b.setAttribute('aria-busy','true');b.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';setTimeout(()=>{b.removeAttribute('aria-busy');b.textContent='Pagar'},2000)}}
}
let io,cur='__';
function spy(){
  if(io) io.disconnect(); if(!('IntersectionObserver' in window)) return;
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting) document.querySelectorAll('#side [data-sec]').forEach(a=>a.classList.toggle('on',a.dataset.sec===e.target.dataset.id));}),{rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('.sec').forEach(x=>io.observe(x));
}
function render(){
  const {c,s}=route(); const ch=CH.find(x=>x.id===c);
  if(c!==cur){
    const lab=document.querySelector('.lab'); if(lab&&lab.parentElement!==holder) holder.appendChild(lab);
    cur=c; drawChrome(c,s);
    $('main').innerHTML=ch?chapterHTML(ch):homeHTML();
    if(ch) ch.secs.forEach(id=>mountSec(document.getElementById('s-'+id),secOf(id)));
    spy();
  } else drawChrome(c,s);
  const t=s&&document.getElementById('s-'+s);
  if(t&&t.scrollIntoView) t.scrollIntoView(); else window.scrollTo(0,0);
  document.title=(ch?ch.q:'Guía de Skeleton views')+' | Guía de Skeleton views';
}
window.addEventListener('hashchange',render);
render();

</script>
